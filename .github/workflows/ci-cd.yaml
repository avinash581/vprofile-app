name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}

jobs:
  # Job 1: Run on pull requests and pushes
  build-and-test:
    name: Build, Test & Checkstyle
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, run unit tests, and generate Checkstyle report
        run: mvn clean verify checkstyle:checkstyle -B

  # Job 2: Build and push the image only after tests pass on main
  docker-build-push:
    name: Build Docker image and push to ECR
    runs-on: ubuntu-24.04
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      ecr_registry: ${{ steps.set-outputs.outputs.ecr_registry }}
      ecr_image: ${{ steps.set-outputs.outputs.ecr_image }}
      image_tag: ${{ steps.set-outputs.outputs.image_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Validate AWS configuration
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "AWS_REGION is missing"; exit 1; }
          test -n "$ECR_REPOSITORY" || { echo "ECR_REPOSITORY is missing"; exit 1; }

      - name: Create ECR repository if needed
        run: |
          set -euo pipefail
          if ! aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1; then
            aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY"
          fi

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker images
        id: set-outputs
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail

          IMAGE_TAG="${GITHUB_SHA::7}"
          IMAGE_NAME="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          docker build \
            --file Docker-files/app/multistage/Dockerfile \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            --tag "${IMAGE_NAME}:latest" \
            .

          docker push "${IMAGE_NAME}:${IMAGE_TAG}"
          docker push "${IMAGE_NAME}:latest"

          echo "ecr_registry=${ECR_REGISTRY}" >> "$GITHUB_OUTPUT"
          echo "ecr_image=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

  # Job 3: Update the separate Helm/GitOps repository
  update-helm:
    name: Update Helm values in separate repo
    runs-on: ubuntu-24.04
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Validate GitOps configuration
        env:
          HELM_REPO_USER: ${{ secrets.HELM_REPO_USER }}
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
        run: |
          set -euo pipefail
          test -n "$HELM_REPO_NAME" || { echo "HELM_REPO_NAME is missing"; exit 1; }
          test -n "$HELM_REPO_USER" || { echo "HELM_REPO_USER is missing"; exit 1; }
          test -n "$GITOPS_PAT" || { echo "GITOPS_PAT is missing"; exit 1; }

      - name: Install yq
        run: |
          set -euo pipefail
          YQ_VERSION="v4.45.1"
          curl --fail --location --silent --show-error \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          sudo install /tmp/yq /usr/local/bin/yq

      - name: Clone Helm repository
        env:
          HELM_REPO_USER: ${{ secrets.HELM_REPO_USER }}
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          git clone \
            "https://${HELM_REPO_USER}:${GITOPS_PAT}@github.com/${REPO_OWNER}/${HELM_REPO_NAME}.git" \
            helm-repo

      - name: Update Helm values.yaml image and tag
        working-directory: helm-repo
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
          ECR_IMAGE: ${{ needs.docker-build-push.outputs.ecr_image }}
        run: |
          set -euo pipefail

          VALUES_FILE="vprofile/values.yaml"

          if [ ! -f "$VALUES_FILE" ]; then
            echo "ERROR: $VALUES_FILE not found."
            find . -type f -name "values.yaml"
            exit 1
          fi

          test -n "$IMAGE_TAG" || { echo "IMAGE_TAG is empty"; exit 1; }
          test -n "$ECR_IMAGE" || { echo "ECR_IMAGE is empty"; exit 1; }

          echo "Updating ${ECR_IMAGE}:${IMAGE_TAG}"

          # Ensure the expected YAML keys exist.
          yq -e '.app | has("image") and has("tag")' "$VALUES_FILE" >/dev/null

          yq eval \
            '.app.image = strenv(ECR_IMAGE) | .app.tag = strenv(IMAGE_TAG)' \
            -i "$VALUES_FILE"

          cat "$VALUES_FILE"

      - name: Commit and push Helm repository update
        working-directory: helm-repo
        env:
          IMAGE_TAG: ${{ needs.docker-build-push.outputs.image_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if ! git diff --quiet -- vprofile/values.yaml; then
            git add vprofile/values.yaml
            git commit -m "Update VProfile image to ${IMAGE_TAG}"
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
