on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-sonar:
    if: github.event_name == 'pull_request'
    name: Build, Test, Checkstyle & SonarQube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
